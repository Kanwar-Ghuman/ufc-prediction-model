# ODDS PROVENANCE — consensus of six books (Polymarket, Kalshi, FanDuel,
# Caesars, BetRivers, BetWay) as listed on BestFightOdds, 2026-09-01
# afternoon ET, averaged in implied probability and converted to decimal.
# predict.py strips the vig.
