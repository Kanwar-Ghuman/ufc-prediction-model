# Tuesday 2026-09-01, Meta Apex, Las Vegas. Five fights, UFC contracts on the line.
#
# Contender Series, not a UFC card: all ten fighters are making their first
# appearance under the UFC banner, so UFC-history features are missing on
# BOTH corners of every bout. Since v3.2 the skill side is the fighters'
# full regional records (Sherdog, resolved by the event page so the right
# Brandon Holmes / Hunter Smith are scored) and the career-view features
# learned from ~1,700 past UFC debutants. v3.3 adds regional Elo, a capped
# dual-debut skill mix from those careers, and Tapology best-rank nudges.
# Odds still do much of the work.
#
# Rankings and regions are Tapology best-rank / circuit labels as listed
# on the event page 2026-09-01. Lower rank number is better.
