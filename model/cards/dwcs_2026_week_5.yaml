# Tuesday 2026-09-08, Meta Apex, Las Vegas. Five fights, UFC contracts on the line.
#
# Contender Series, not a UFC card: nine of ten fighters are making their first
# appearance under the UFC banner. Won Il Kwon is a DWCS returnee (lost to
# Juan Diaz last season) but still has no ufcstats history, so UFC-history
# features are missing on BOTH corners of every bout. Since v3.2 the skill
# side is the fighters' full regional records (Sherdog, resolved by the event
# page) and the career-view features learned from ~1,700 past UFC debutants.
# v3.3 adds regional Elo, a capped dual-debut skill mix from those careers,
# and Tapology best-rank nudges. Odds still do much of the work.
