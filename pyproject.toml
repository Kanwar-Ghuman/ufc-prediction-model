[project]
name = "octagon"
version = "0.1.0"
description = "Octagon Oracle — UFC fight outcome prediction with calibrated probabilities and a paper-trading backtest (educational, no real-money betting)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",          # Parquet support for data/processed/
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    # catboost is optional — add in Phase B if we want a third GBM to compare.
    "optuna>=3.6",            # hyperparameter search (Phase B)
    "shap>=0.45",             # explainability (Phase C)
    "numba>=0.60",            # shap dependency; pinned so the resolver
                              # doesn't fall back to unbuildable old versions
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",              # fast HTML parser backend for BeautifulSoup
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",        # run notebooks/ from VS Code or Jupyter
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octagon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
