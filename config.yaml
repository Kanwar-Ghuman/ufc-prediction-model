# Central configuration for Octagon Oracle.
# Every script/notebook reads from here so experiments are reproducible.

seed: 42

data:
  raw_dir: data/raw
  greco_dir: data/raw/greco           # Greco1899 ufcstats scrape — canonical fights (1994-2026)
  bootstrap_dir: data/raw/bootstrap   # jansen88/ufc-data CSVs — contributes closing odds (2014-2023)
  html_cache_dir: data/raw/html       # cached ufcstats.com pages — never re-scrape what we have
  processed_dir: data/processed
  db_path: data/ufc.db

scraping:
  base_url: "http://ufcstats.com"
  rate_limit_seconds: 1.0             # be polite: at most ~1 request/second
  timeout_seconds: 30

# Chronological splits — NEVER random-split fights (see PRD section 6).
# Greco data runs through 2026-05, so the PRD's target splits apply:
splits:
  train_end: "2021-12-31"    # train: everything through 2021
  valid_end: "2023-12-31"    # validate: 2022-2023
  # test = 2024+ (1,244 fights the models never touch until the end)

# GBM configuration (v2.2, adopted after paired-bootstrap ablation on 5,549
# OOS fights 2015-2023: raw features -0.011 log loss CI [-.016,-.006],
# 5-seed ensemble -0.002 CI [-.003,-.000]).
model:
  n_seeds: 5          # average this many differently-seeded GBMs
  include_raw: true   # f1_/f2_ levels next to diffs -> matchup interactions

elo:
  initial_rating: 1500.0
  # Tuned by sweeping K over [8, 260] and scoring Elo win-probability log
  # loss on validation fights (2022-2023): minimum at ~80 (0.6806), flat
  # 60-100, worse both below and above. Chess-style K=32 was underconfident.
  k_factor: 80.0

betting:
  # Paper trading only. No real-money functionality anywhere in this repo.
  edge_threshold: 0.04                # min (model prob - vig-free market prob) to flag a bet
  kelly_fraction: 0.25                # quarter-Kelly cap

# Abstain band (M5 error analysis): predictions in [low, high] are labeled
# "no call". On validation, fights inside the band were 53% coin flips;
# outside it the blend scores 63.9% at 76% coverage.
abstain:
  low: 0.45
  high: 0.55
